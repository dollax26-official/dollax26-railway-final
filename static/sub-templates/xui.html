<!doctype html>
<html lang="$lang" dir="$dir" data-theme="$theme" data-style="$style">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>$panel — Subscription Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F1013;color:#E8EAED;font-family:Inter,system-ui,-apple-system,sans-serif}
.xu{max-width:940px;margin:22px auto;padding:0 16px}
.xu-title{font-size:24px;font-weight:700;color:#F2F3F5;text-align:center;margin:6px 0 18px}
.xu-card{background:#141519;border:1px solid #26272C;border-radius:12px;padding:20px;margin-bottom:16px}
.xu-card h2{font-size:19px;font-weight:700;color:#F2F3F5;text-align:center;margin:0 0 16px}
.xu-rows{display:grid;gap:10px}
.xu-row{display:flex;align-items:center;gap:12px;background:#1C1D21;border:1px solid #26272C;border-radius:8px;
  padding:12px 14px;min-height:52px}
.xu-k{color:#9AA0A6;font-size:13px;min-width:96px}
.xu-v{color:#E8EAED;font-size:14px}
.xu-pill{background:#2FA84F;color:#fff;border-radius:4px;padding:2px 9px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em}
.xu-code{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#E3E8EE}
.xu-btn{background:#4A7DE0;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:.15s}
.xu-btn:hover{background:#3B6FD0}
.xu-btn.alt{background:#5A7DA6}
.xu-btn.alt:hover{background:#4A6D96}
.xu-all{display:block;width:100%;background:#2FA84F;color:#fff;border:0;border-radius:8px;padding:14px;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;font-family:inherit}
.xu-all:hover{background:#279143}
details.qr summary{list-style:none;cursor:pointer;background:#5A7DA6;color:#fff;border-radius:6px;padding:8px 12px;
  font-size:13px}
details.qr summary:hover{background:#4A6D96}
.qrbox{background:#fff;border-radius:8px;padding:8px;width:150px;height:150px;margin-top:8px}
.xu-apps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.app-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;justify-content:center}
.app-group-k{font-size:11px;color:#9AA0A6;min-width:64px}
.app-chip{font-size:12px;color:#CFE0FF;text-decoration:none;border:1px solid #3B5B96;border-radius:999px;padding:5px 11px}
.app-chip:hover{background:#4A7DE0;color:#fff}
.sc-row{display:flex;align-items:center;gap:12px;background:#1C1D21;border:1px solid #26272C;
  border-radius:8px;padding:12px 14px;min-height:52px}
.sc-badge{background:#4A7DE0;color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;
  text-transform:uppercase}
.sc-cfgname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#E3E8EE}
.sc-btn{background:#4A7DE0;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;
  font-family:inherit}
.sc-btn:hover{background:#3B6FD0}
.xu-acct{display:grid;gap:10px}
.xu-acct-row{display:flex;justify-content:space-between;gap:12px;background:#1C1D21;border:1px solid #26272C;
  border-radius:8px;padding:12px 14px}
.xu-acct-row .k{color:#9AA0A6;font-size:13px}
.xu-acct-row .v{color:#E8EAED;font-size:14px;font-weight:600}
.info-card{background:#141519;border:1px dashed #3A3B42;border-radius:12px;padding:16px;margin-bottom:16px}
.foot{text-align:center;color:#6B7280;font-size:11px;margin:16px 0 6px}
</style>
</head>
<body>
<div class="xu">
  <h1 class="xu-title">$l_subinfo</h1>

  <div class="xu-card">
    <h2>$l_account</h2>
    <div class="xu-acct">
      <div class="xu-acct-row"><span class="k">$l_user</span><span class="v">$title</span></div>
      <div class="xu-acct-row"><span class="k">$l_status</span><span class="v"><span class="xu-pill">$l_active</span></span></div>
      <div class="xu-acct-row"><span class="k">$l_used</span><span class="v">$used · $pct%</span></div>
      <div class="xu-acct-row"><span class="k">$l_remaining</span><span class="v">$remaining</span></div>
      <div class="xu-acct-row"><span class="k">$l_expires</span><span class="v">$expires</span></div>
    </div>
  </div>

  <div class="xu-card">
    <h2>$l_links</h2>
    <div class="xu-rows">$rows</div>
    <button class="xu-all" type="button" data-copy="$sub_url">$l_copy_all</button>
  </div>

  $info

  <div class="xu-card">
    <h2>$l_apps</h2>
    $apps
  </div>

  <p class="foot">$panel · $endpoint</p>
</div>
<script>
(function () {
  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta); return ok;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    e.preventDefault();
    var txt = b.getAttribute('data-copy') || '';
    var done = function () { var o = b.textContent; b.textContent = '$l_copied';
      setTimeout(function () { b.textContent = o; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { if (fallback(txt)) done(); });
    } else if (fallback(txt)) { done(); }
  });
})();
</script>
</body>
</html>
