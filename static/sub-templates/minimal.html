<!doctype html>
<html lang="$lang" dir="$dir" data-theme="$theme" data-style="$style">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$panel — $title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#111827;font-family:Inter,system-ui,sans-serif}
.mn-wrap{max-width:860px;margin:34px auto;padding:0 16px}
.mn-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mn-logo{width:40px;height:40px;border-radius:11px;background:#111827;color:#fff;display:grid;place-items:center;
  font-weight:800}
.mn-t{font-weight:700;font-size:15px}
.mn-s{font-size:11px;color:#6b7280;margin-top:2px}
.mn-qr{background:#fff;border:1px solid #e8eaee;border-radius:12px;padding:8px;width:128px;height:128px;
  flex:0 0 auto;margin-inline-start:auto}
.mn-card{background:#fff;border:1px solid #e8eaee;border-radius:14px;padding:16px;margin-top:14px}
.mn-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.mn-k{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}
.mn-v{font-size:16px;font-weight:650;margin-top:2px;word-break:break-word}
.mn-bar{height:6px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:12px}
.mn-bar>i{display:block;height:100%;background:#111827}
.sc-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.sc-name{font-weight:650}
.sc-grow{flex:1 1 auto}
.sc-badge{font-size:10px;border-radius:99px;padding:2px 8px;background:#f1f3f6;color:#4b5563}
.sc-badge.ok{background:#e7f8ee;color:#166534}
.sc-badge.warn{background:#fef6e0;color:#92400e}
.sc-badge.bad{background:#fdecec;color:#991b1b}
.sc-bar{height:6px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:10px 0}
.sc-bar>i{display:block;height:100%;background:#111827}
.sc-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#4b5563;margin-bottom:8px}
.sc-row{display:flex;gap:8px;align-items:center;border:1px solid #eceef2;border-radius:10px;
  padding:7px 9px;margin-top:6px;background:#fcfcfd}
.sc-idx{font-size:10px;color:#9ca3af}
.sc-code{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#374151}
.sc-btn{border:1px solid #111827;background:#fff;color:#111827;border-radius:8px;padding:5px 10px;
  font-size:11px;cursor:pointer;transition:.15s}
.sc-btn:hover{background:#111827;color:#fff}
.mn-foot{text-align:center;color:#9ca3af;font-size:10px;margin:18px 0 4px}
@media (max-width:600px){.mn-qr{width:104px;height:104px}}

.sc-cfgname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 11px; font-weight: 600; }
.app-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.app-group-k { font-size: 10px; opacity: .65; text-transform: uppercase; letter-spacing: .06em; min-width: 62px; }
.app-chip { font-size: 11px; text-decoration: none; padding: 4px 9px; border-radius: 99px;
  border: 1px solid currentColor; opacity: .82; }
.app-chip:hover { opacity: 1; }
.info-card { border-style: dashed; opacity: .92; }
</style>
</head>
<body>
<div class="mn-wrap">
  <div class="mn-h">
    <div class="mn-logo">D</div>
    <div style="min-width:0">
      <div class="mn-t">$panel</div>
      <div class="mn-s">$title · $endpoint</div>
    </div>
    <div class="mn-qr">$qr</div>
  </div>

  <div class="mn-card">
    <div class="mn-rows">$tags</div>
    <div class="mn-bar"><i style="width:$pct%"></i></div>
    <div class="mn-s" style="margin-top:8px">$pct% $l_used · $clients $l_clients · $configs $l_configs</div>
  </div>

  <div class="mn-card">
    <div class="mn-k" style="margin-bottom:8px">$l_sub</div>
    <div class="sc-row">
      <code class="sc-code">$sub_url</code>
      <button class="sc-btn" type="button" data-copy="$sub_url">$l_copy</button>
      <button class="sc-btn" type="button" data-copy="$sub_clash">$l_clash</button>
      <button class="sc-btn" type="button" data-copy="$sub_singbox">$l_singbox</button>
    </div>
  </div>

  $cards

  $info

  <div class="sc-card"><div class="sc-head"><span class="sc-name">$l_apps</span></div>$apps</div>

  <p class="mn-foot">$l_footer · $panel</p>
</div>
<script>
(function () {
  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    e.preventDefault();
    var txt = b.getAttribute('data-copy') || '';
    var done = function () {
      var old = b.textContent; b.textContent = 'Copied!';
      setTimeout(function () { b.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { if (fallback(txt)) done(); });
    } else if (fallback(txt)) { done(); }
  });
})();
</script>
</body>
</html>
