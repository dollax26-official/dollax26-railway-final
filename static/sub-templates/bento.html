<!doctype html>
<html lang="$lang" dir="$dir" data-theme="$theme" data-style="$style">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>$panel — $title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e8eef5;font-family:Inter,system-ui,sans-serif}
.bn-wrap{max-width:980px;margin:24px auto;padding:0 14px}
.bn-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.bn-tile{grid-column:span 3;background:#121821;border:1px solid #1e2836;border-radius:16px;padding:14px}
.bn-tile.wide{grid-column:span 6}
.bn-tile.full{grid-column:span 12}
.bn-k{font-size:10px;color:#8b9bb0;text-transform:uppercase;letter-spacing:.06em}
.bn-v{font-size:18px;font-weight:700;margin-top:4px;word-break:break-word}
.bn-big{font-size:26px}
.bn-bar{height:7px;background:#1a2330;border-radius:99px;overflow:hidden;margin-top:10px}
.bn-bar>i{display:block;height:100%;background:linear-gradient(90deg,#3ea6ff,#7c5cff)}
.bn-qr{background:#fff;border-radius:12px;padding:6px;width:112px;height:112px;margin-inline-start:auto;flex:0 0 auto}
.sc-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.sc-name{font-weight:700}
.sc-grow{flex:1 1 auto}
.sc-badge{font-size:10px;border-radius:99px;padding:2px 8px;background:#1b2432;color:#c3d2e4}
.sc-badge.ok{background:#123528;color:#6ee7b7}
.sc-badge.warn{background:#3a2f10;color:#fcd34d}
.sc-badge.bad{background:#3a1414;color:#fca5a5}
.sc-bar{height:7px;background:#1a2330;border-radius:99px;overflow:hidden;margin:10px 0}
.sc-bar>i{display:block;height:100%;background:linear-gradient(90deg,#3ea6ff,#7c5cff)}
.sc-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#a8b8cc;margin-bottom:8px}
.sc-row{display:flex;gap:8px;align-items:center;background:#0e141c;border:1px solid #1b2432;
  border-radius:11px;padding:7px 9px;margin-top:6px}
.sc-idx{font-size:10px;color:#7d8ea5}
.sc-code{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-size:10.5px}
.sc-btn{border:1px solid #2a3648;background:#151d28;color:#cfe0f2;border-radius:9px;padding:5px 10px;
  font-size:11px;cursor:pointer;transition:.15s}
.sc-btn:hover{background:#3ea6ff;color:#04121f;border-color:#3ea6ff}
.bn-foot{text-align:center;color:#6b7c93;font-size:10px;margin:16px 0 4px}
@media (max-width:820px){.bn-tile,.bn-tile.wide{grid-column:span 6}}
@media (max-width:520px){.bn-tile,.bn-tile.wide{grid-column:span 12}}
</style>
</head>
<body>
<div class="bn-wrap">
  <div class="bn-grid">
    <div class="bn-tile wide">
      <div class="bn-k">$panel</div>
      <div class="bn-v bn-big">$title</div>
      <div class="bn-k" style="margin-top:6px">$endpoint</div>
      <div class="bn-bar"><i style="width:$pct%"></i></div>
      <div class="bn-k" style="margin-top:7px">$pct% $l_used · $used</div>
    </div>
    <div class="bn-tile wide" style="display:flex;gap:14px;align-items:center">
      <div style="min-width:0">
        <div class="bn-k">$protocol</div>
        <div class="bn-v">$clients $l_clients</div>
        <div class="bn-k" style="margin-top:6px">$configs $l_configs</div>
      </div>
      <div class="bn-qr">$qr</div>
    </div>

    $tags

    <div class="bn-tile full">
      <div class="bn-k" style="margin-bottom:8px">$l_sub</div>
      <div class="sc-row">
        <code class="sc-code">$sub_url</code>
        <button class="sc-btn" type="button" data-copy="$sub_url">$l_copy</button>
        <button class="sc-btn" type="button" data-copy="$sub_clash">$l_clash</button>
        <button class="sc-btn" type="button" data-copy="$sub_singbox">$l_singbox</button>
      </div>
    </div>

    $cards
  </div>
  <p class="bn-foot">$l_footer · $panel</p>
</div>
<script>
(function () {
  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    e.preventDefault();
    var txt = b.getAttribute('data-copy') || '';
    var done = function () {
      var old = b.textContent; b.textContent = 'Copied!';
      setTimeout(function () { b.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { if (fallback(txt)) done(); });
    } else if (fallback(txt)) { done(); }
  });
})();
</script>
</body>
</html>
