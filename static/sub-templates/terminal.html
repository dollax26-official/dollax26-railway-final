<!doctype html>
<html lang="$lang" dir="$dir" data-theme="$theme" data-style="$style">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>$panel — $title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#04070a;color:#7cffb2;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.tm-wrap{max-width:900px;margin:26px auto;padding:0 14px}
.tm-box{border:1px solid #16d97a44;border-radius:12px;padding:16px;background:#060b0f;
  box-shadow:0 0 32px #16d97a22 inset}
.tm-head{display:flex;gap:10px;align-items:center;color:#bfffe0;font-weight:700}
.tm-dot{width:9px;height:9px;border-radius:50%;background:#16d97a;box-shadow:0 0 8px #16d97a}
.tm-dim{color:#4d8a6c;font-size:11px}
.tm-line{margin-top:8px;font-size:12px}
.tm-bar{height:6px;background:#0d2018;border-radius:99px;overflow:hidden;margin-top:6px}
.tm-bar>i{display:block;height:100%;background:#16d97a}
.tm-qr{background:#fff;border-radius:8px;padding:6px;width:120px;height:120px;flex:0 0 auto}
.sc-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.sc-name{font-weight:700;color:#bfffe0}
.sc-grow{flex:1 1 auto}
.sc-badge{font-size:10px;border:1px solid #16d97a55;border-radius:99px;padding:1px 7px;color:#7cffb2}
.sc-badge.warn{color:#fcd34d;border-color:#fcd34d55}
.sc-badge.bad{color:#fca5a5;border-color:#fca5a555}
.sc-bar{height:6px;background:#0d2018;border-radius:99px;overflow:hidden;margin:8px 0}
.sc-bar>i{display:block;height:100%;background:#16d97a}
.sc-meta{display:flex;gap:10px;flex-wrap:wrap;color:#7fe0ab;font-size:11px;margin-bottom:6px}
.sc-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.sc-idx{color:#3d6b55;font-size:10px}
.sc-code{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10.5px;color:#d6ffee}
.sc-btn{border:1px solid #16d97a55;background:#08251a;color:#7cffb2;border-radius:7px;padding:3px 8px;
  font-size:10px;cursor:pointer;font-family:inherit}
.sc-btn:hover{background:#16d97a;color:#04120c}
.tm-foot{text-align:center;color:#3d6b55;font-size:10px;margin:18px 0 4px}
@media (max-width:600px){.tm-qr{width:96px;height:96px}}
</style>
</head>
<body>
<div class="tm-wrap">
  <div class="tm-box">
    <div class="tm-head"><span class="tm-dot"></span> $panel :: $title</div>
    <div class="tm-dim" style="margin-top:6px">endpoint $endpoint</div>
    <div class="tm-dim">$protocol &nbsp;|&nbsp; $clients $l_clients &nbsp;|&nbsp; $configs $l_configs</div>

    <div style="display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap">
      <div style="min-width:0;flex:1 1 240px">
        <div class="tm-line">$l_used <b>$used</b> &nbsp; $pct%</div>
        <div class="tm-bar"><i style="width:$pct%"></i></div>
        <div class="tm-dim" style="margin-top:6px">$l_up $up &nbsp; $l_down $down &nbsp; $l_remaining $remaining &nbsp; $l_expires $expires</div>
      </div>
      <div class="tm-qr">$qr</div>
    </div>

    <div class="tm-line">$l_sub: <code>$sub_url</code></div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">
      <button class="sc-btn" type="button" data-copy="$sub_url">$l_copy</button>
      <button class="sc-btn" type="button" data-copy="$sub_clash">$l_clash</button>
      <button class="sc-btn" type="button" data-copy="$sub_singbox">$l_singbox</button>
    </div>

    $cards
  </div>
  <p class="tm-foot">$l_footer · $panel</p>
</div>
<script>
(function () {
  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    e.preventDefault();
    var txt = b.getAttribute('data-copy') || '';
    var done = function () {
      var old = b.textContent; b.textContent = 'Copied!';
      setTimeout(function () { b.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { if (fallback(txt)) done(); });
    } else if (fallback(txt)) { done(); }
  });
})();
</script>
</body>
</html>
