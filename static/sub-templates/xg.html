<!doctype html>
<html lang="$lang" dir="$dir" data-theme="$theme" data-style="$style">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>$panel — $title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0B1120;color:#F9FAFB;font-family:Vazirmatn,Inter,system-ui,sans-serif}
.xg{max-width:920px;margin:0 auto;padding:16px 14px 40px}
/* top bar: theme glyph + brand block */
.xg-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.xg-toggle{width:36px;height:36px;border-radius:50%;background:#111827;border:1px solid #1F2937;color:#F5A623;
  display:grid;place-items:center;cursor:pointer;font-size:15px}
.xg-top .grow{flex:1 1 auto}
.xg-brand{display:flex;align-items:center;gap:10px}
.xg-logo{width:40px;height:40px;border-radius:12px;color:#fff;font-weight:800;
  background:linear-gradient(135deg,#8B5CF6,#3B82F6);display:grid;place-items:center;font-size:17px}
.xg-brandname{font-size:20px;font-weight:800;line-height:1.1}
.xg-brandsub{color:#9CA3AF;font-size:11px}
/* cards */
.xg-card{background:#111827;border:1px solid #1F2937;border-radius:16px;padding:18px;margin-bottom:14px}
.xg-card h2{font-size:16px;font-weight:700;margin:0 0 12px}
.xg-banner{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:16px 18px;cursor:pointer;
  background:linear-gradient(135deg,#2563EB,#3B82F6);color:#fff;width:100%;text-align:start;font-family:inherit}
.xg-banner:hover{filter:brightness(1.06)}
.xg-banner .t{font-size:14px;font-weight:700}
.xg-banner .s{font-size:11px;opacity:.9}
.xg-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.xg-stat{background:#111827;border:1px solid #1F2937;border-radius:14px;padding:13px}
.xg-stat .k{color:#9CA3AF;font-size:11px}
.xg-stat .v{font-size:16px;font-weight:700;margin-top:3px;word-break:break-word}
.xg-sec{font-size:15px;font-weight:700;margin:16px 2px 10px}
/* config rows */
.rows{display:grid;gap:10px}
.sc-row{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:12px 14px;display:flex;
  flex-wrap:wrap;align-items:center;gap:10px}
.sc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc-name{font-weight:700;font-size:13px}
.sc-grow{flex:1 1 auto}
.sc-badge{background:rgba(139,92,246,.18);color:#C4B5FD;border:1px solid #5B21B6;border-radius:6px;padding:2px 7px;
  font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.sc-badge.ok{background:rgba(16,185,129,.15);color:#6EE7B7;border-color:#065F46}
.sc-badge.warn{background:rgba(245,158,11,.15);color:#FCD34D;border-color:#92400E}
.sc-badge.bad{background:rgba(239,68,68,.15);color:#FCA5A5;border-color:#991B1B}
.sc-bar{height:8px;border-radius:99px;background:#374151;overflow:hidden}
.sc-bar>i{display:block;height:100%;background:#10B981}
.sc-meta{display:flex;gap:12px;flex-wrap:wrap;color:#9CA3AF;font-size:11px}
.sc-cfgname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.sc-btn{background:#2563EB;color:#fff;border:0;border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;
  font-family:inherit}
.sc-btn:hover{background:#1D4ED8}
details.qr summary{list-style:none;cursor:pointer;background:#1E293B;border:1px solid #334155;border-radius:8px;
  padding:7px 11px;font-size:12px;color:#C7D2FE}
details.qr summary:hover{background:#2563EB;color:#fff;border-color:#2563EB}
.qrbox{background:#fff;border-radius:10px;padding:8px;width:150px;height:150px;margin-top:8px}
/* apps + info */
.app-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.app-group-k{font-size:11px;color:#9CA3AF;min-width:64px}
.app-chip{font-size:12px;color:#BFDBFE;text-decoration:none;border:1px solid #1D4ED8;border-radius:999px;padding:5px 11px}
.app-chip:hover{background:#2563EB;color:#fff}
.info-card{background:#111827;border:1px dashed #374151;border-radius:16px;padding:16px;margin-bottom:14px}
.foot{text-align:center;color:#64748B;font-size:11px;margin-top:16px}
</style>
</head>
<body>
<div class="xg">
  <div class="xg-top">
    <span class="xg-toggle" title="$l_theme">☀</span>
    <span class="grow"></span>
    <span class="xg-brand">
      <span class="xg-brandname">$panel</span>
      <span class="xg-brandsub">$title</span>
      <span class="xg-logo">D</span>
    </span>
  </div>

  <div class="xg-card">
    <h2>$l_group</h2>
    <div class="sc-meta">
      <span>$endpoint</span><span>$protocol</span><span>$clients $l_clients</span>
    </div>
  </div>

  <button class="xg-banner" type="button" data-copy="$sub_url">
    <span>
      <span class="t">$l_copy_all</span><br>
      <span class="s">$l_sub</span>
    </span>
  </button>

  <div class="xg-stats" style="margin-top:14px">$tags</div>

  <div class="xg-sec">$l_configs ($configs)</div>
  <div class="rows">$rows</div>

  $info

  <div class="xg-card" style="margin-top:14px">
    <h2>$l_apps</h2>
    $apps
  </div>

  <p class="foot">$l_footer · $panel</p>
</div>
<script>
(function () {
  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta); return ok;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    e.preventDefault();
    var txt = b.getAttribute('data-copy') || '';
    var done = function () { var o = b.textContent; b.textContent = '$l_copied';
      setTimeout(function () { b.textContent = o; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { if (fallback(txt)) done(); });
    } else if (fallback(txt)) { done(); }
  });
})();
</script>
</body>
</html>
